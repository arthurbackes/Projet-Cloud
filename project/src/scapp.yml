version: "3"
services:     # list all services for your application
  # database of users
  users-db:
    # image name
    image: ${DOCKER_ID}/kv-storage-system:latest
    ports: ["3001:5984"]
    volumes:
      - users-data:/opt/couchdb/data
    deploy:
      # deploy only one instance of this service
      replicas: 1
      restart_policy:
        # restart if something went wrong
        condition: on-failure
    networks: [ "scapp-net" ]
  # server that listens HTTP requests
  users-daemon:
    image: ${DOCKER_ID}/scapp-auth:latest
    # link both services (same effect of option --link in docker run)
    depends_on: [ "users-db" ]
    # expose port number 3000 of host running this service
    ports: [ "3000:80" ]
    environment: # boot in order
      - WITH_PERSISTENT_DATA=Y
      - DB_NAME=users
      - DB_URL=http://admin:admin@users-db:5984/users
      - TOKEN_SECRET=${TOKEN_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks: [ "scapp-net" ]

  products-db:
    image: ${DOCKER_ID}/kv-storage-system:latest
    ports: ["3003:5984"]
    volumes:
      - products-data:/opt/couchdb/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks: [ "scapp-net" ]
  
  products-daemon:
    image: ${DOCKER_ID}/scapp-products:latest
    depends_on: [ "products-db" ]
    ports: [ "3002:80" ]
    environment:
      - WITH_PERSISTENT_DATA=Y 
      - DB_NAME=products
      - DB_URL=http://admin:admin@products-db:5984/products
      - TOKEN_SECRET=${TOKEN_SECRET}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks: [ "scapp-net" ]

  gateway:
    image: ${DOCKER_ID}/scapp-gateway:latest
    depends_on: [ "products-daemon", "users-daemon" ]
    ports: [ "8080:80"]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks: [ "scapp-net" ]
  
  # Docker GUI for swarms
  visualizer:
    image: dockersamples/visualizer:stable
    ports: [ "80:8080" ]
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    deploy:
      # locate this service in the swarm manager
      placement:
        constraints:
          - node.role == manager
    networks: [ "scapp-net" ]
networks:
  scapp-net:
    external: true
  
volumes:
  users-data:
  products-data: