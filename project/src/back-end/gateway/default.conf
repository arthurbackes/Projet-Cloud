server {
    listen 80;
    location /user {
        proxy_pass http://users-daemon:80;
    }
    location /api/products {
        proxy_pass http://products-daemon:80;
    }
    location /api/cart {
        proxy_pass http://shopping-daemon:80;
    }
    location /api/purchases {
        proxy_pass http://shopping-daemon:80;
    }
}